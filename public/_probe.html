<!doctype html>
<meta charset="utf-8" />
<title>probe</title>
<iframe id="f" style="width:1440px;height:2000px;border:0" src="/"></iframe>
<pre id="out"></pre>
<script>
  function run() {
    const d = document.getElementById('f').contentDocument
    if (!d.querySelector('.insc-band__grid')) return setTimeout(run, 300)
    const w = document.getElementById('f').contentWindow
    const r = {}
    for (const s of ['.insc-band', '.insc-band__grid', '.insc-band__left', '.insc-form-panel', '.insc-band__left p', '.field label']) {
      const el = d.querySelector(s)
      if (!el) { r[s] = null; continue }
      const b = el.getBoundingClientRect()
      r[s] = { top: Math.round(b.top), h: Math.round(b.height) }
    }
    r.gridAlign = w.getComputedStyle(d.querySelector('.insc-band__grid')).alignItems
    r.docH = d.documentElement.scrollHeight
    document.getElementById('out').textContent = 'PROBE ' + JSON.stringify(r)
  }
  run()
</script>
